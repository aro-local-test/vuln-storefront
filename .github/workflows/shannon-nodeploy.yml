name: Shannon test (no deploy, no config)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aro-local-test/shannon-action@v1
        with:
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
          target-url: https://shannon-vuln-storefront-demo.fly.dev
          config-path: does-not-exist.yml   # no config -> max scope, no report.sarif
          pipeline-testing: true
          fail-on: none
