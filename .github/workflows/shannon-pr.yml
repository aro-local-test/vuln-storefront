name: Shannon Pentest (deploy + scan on PR)
on:
  pull_request:
permissions:
  contents: read
  security-events: write
  pull-requests: write
concurrency:
  group: shannon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deploy-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy this PR's code to fly.io
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy --remote-only --app shannon-vuln-storefront-demo
          echo "url=https://shannon-vuln-storefront-demo.fly.dev" >> "$GITHUB_OUTPUT"

      - name: Wait for the deployment to be reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" != "000" ] && exit 0
            sleep 5
          done
          echo "::error::target never became reachable"; exit 1

      - name: Shannon scan (smoke)
        uses: aro-local-test/shannon-action@v1
        with:
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
          target-url: ${{ steps.deploy.outputs.url }}
          config-path: .shannon/ci.yml
          fail-on: none
          pipeline-testing: true    # SMOKE first; flip to false for the real scan
