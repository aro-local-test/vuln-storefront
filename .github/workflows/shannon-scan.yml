name: Shannon Pentest (action)
on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  pentest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: aro-local-test/shannon-action@v1
        with:
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
          target-url: https://shannon-vuln-storefront-demo.fly.dev
          config-path: .shannon/ci.yml
          fail-on: none
