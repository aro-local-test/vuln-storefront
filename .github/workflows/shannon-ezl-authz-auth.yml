name: Shannon (ezl action) - authenticated authz-only (final run)
run-name: ezl AUTH authz-only @ main
on:
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
concurrency:
  group: shannon-ezl-authzauth-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLY_ORG: keygraph-634
      ADMIN_PW: ShannonAuth-Test-2026
    steps:
      # Exact whitebox: deploy this repo's own source (remediated main) from its Dockerfile.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy vuln-storefront (from source) with a known admin password
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="shannon-ezl-authzauth-${GITHUB_RUN_ID}"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "url=https://$APP.fly.dev" >> "$GITHUB_OUTPUT"
          flyctl apps create "$APP" --org "$FLY_ORG"
          # Known admin password so Shannon can authenticate; staged, then applied by the deploy.
          flyctl secrets set STOREFRONT_ADMIN_PASSWORD="$ADMIN_PW" -a "$APP" --stage
          flyctl deploy --remote-only --config fly.toml --app "$APP" --ha=false --yes

      - name: Wait for the deployment to be reachable
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || echo 000)
            echo "attempt $i: HTTP $code"
            case "$code" in 2*|3*|4*) echo "reachable"; exit 0 ;; esac
            sleep 5
          done
          echo "target did not become reachable in time"; exit 1

      - name: Sanity-check the credentials actually log in
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          body=$(curl -s -X POST "$URL/login" -H 'Content-Type: application/json' \
            -d "{\"user\":\"admin\",\"password\":\"${ADMIN_PW}\"}")
          echo "login response: $body"
          case "$body" in *'"ok":true'*) echo "credentials OK" ;; *) echo "LOGIN FAILED with configured password"; exit 1 ;; esac

      - name: Write authenticated, authz-only Shannon config
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          mkdir -p .shannon
          # Unquoted heredoc: ${URL}/${ADMIN_PW} expand; \$username/\$password stay literal for Shannon.
          cat > .shannon/scan.yml <<EOF
          exploit: "true"
          vuln_classes:
            - authz
          report:
            sarif: "true"
          authentication:
            login_type: form
            login_url: ${URL}/login
            credentials:
              username: admin
              password: ${ADMIN_PW}
            login_flow:
              - "Type \$username into the text input named user"
              - "Type \$password into the password input named password"
              - "Click the Log in button"
            success_condition:
              type: text_contains
              value: '"ok":true'
          rules_of_engagement: |
            Ephemeral CI runner, no inbound network / OOB collaborator. Do not set up
            out-of-band callbacks or brute-force credentials; confirm from source or mark
            blocked and move on. Prefer code analysis; time-box each candidate.
          EOF
          echo "--- .shannon/scan.yml ---"; cat .shannon/scan.yml

      - name: Shannon scan (ezl-test/shannon-action@v1)
        uses: ezl-test/shannon-action@v1
        with:
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
          url: ${{ steps.deploy.outputs.url }}
          repo: ${{ github.workspace }}
          config: .shannon/scan.yml
          fail-on-severity: high

      - name: Destroy the per-run fly app
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps destroy "${{ steps.deploy.outputs.app }}" --yes || true
