name: Shannon (ezl action) - VAmPI (vulnerable REST API)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
concurrency:
  group: shannon-ezl-vampi-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FLY_ORG: keygraph-634
    steps:
      # Exact whitebox: check out VAmPI source AND build the deployed target from that source.
      - name: Check out VAmPI source
        uses: actions/checkout@v4
        with:
          repository: erev0s/VAmPI

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Write fly.toml (build from source) and guardrail config
        run: |
          cat > fly.toml <<'EOF'
          app = "placeholder"
          primary_region = "iad"
          [build]
            dockerfile = "Dockerfile"
          [http_service]
            internal_port = 5000
            force_https = true
            auto_stop_machines = "off"
            min_machines_running = 1
          [[vm]]
            size = "shared-cpu-1x"
            memory = "512mb"
          EOF
          mkdir -p .shannon
          printf 'exploit: "true"\nreport:\n  sarif: "true"\nrules_of_engagement: |\n  Ephemeral CI runner, no inbound network or out-of-band collaborator. Do not\n  set up out-of-band callbacks or brute-force credentials; confirm from source\n  or mark blocked and move on. Time-box each candidate.\n' > .shannon/scan.yml

      - name: Build & deploy VAmPI (from source) to a fresh fly app
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="shannon-ezl-vampi-${GITHUB_RUN_ID}"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "url=https://$APP.fly.dev" >> "$GITHUB_OUTPUT"
          flyctl apps create "$APP" --org "$FLY_ORG"
          flyctl deploy --remote-only --config fly.toml --app "$APP" --ha=false --yes

      - name: Wait for the deployment, then initialise the DB
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || echo 000)
            echo "attempt $i: HTTP $code"
            case "$code" in 2*|3*|4*) echo "reachable"; break ;; esac
            sleep 5
          done
          echo "createdb: $(curl -s "$URL/createdb" || echo failed)"

      - name: Shannon scan (ezl-test/shannon-action@v1)
        uses: ezl-test/shannon-action@v1
        with:
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
          url: ${{ steps.deploy.outputs.url }}
          config: .shannon/scan.yml
          fail-on-severity: high

      - name: Destroy the per-run fly app
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps destroy "${{ steps.deploy.outputs.app }}" --yes || true
