name: Shannon (ezl action) - parameterized
run-name: ezl ${{ inputs.profile }} @ ${{ inputs.ref }} (fail-on ${{ inputs.fail_on }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'vuln-storefront git ref to deploy + scan (e.g. v0.1.0 = vulnerable, main = remediated)'
        required: true
        default: 'main'
      profile:
        description: 'config profile: guardrail | bare | invalid'
        required: true
        default: 'guardrail'
      fail_on:
        description: 'fail-on-severity'
        required: true
        default: 'high'
permissions:
  contents: read
  security-events: write
concurrency:
  group: shannon-ezl-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FLY_ORG: keygraph-634
    steps:
      # Exact whitebox: check out the chosen ref; the app is built from that same source below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Write scan config for the profile
        run: |
          mkdir -p .shannon
          if [ "${{ inputs.profile }}" = "guardrail" ]; then
            printf 'exploit: "true"\nreport:\n  sarif: "true"\nrules_of_engagement: |\n  Ephemeral CI runner, no inbound network or out-of-band collaborator. Do not\n  set up out-of-band callbacks (tunnels, external listeners) or brute-force\n  credentials; confirm from source or mark blocked and move on. Time-box each\n  candidate; once you reach a blocked or false-positive verdict, stop.\n' > .shannon/scan.yml
          elif [ "${{ inputs.profile }}" = "bare" ]; then
            printf 'exploit: "true"\nreport:\n  sarif: "true"\n' > .shannon/scan.yml
          else
            printf 'exploit: "maybe"\n' > .shannon/scan.yml
          fi
          echo "--- profile=${{ inputs.profile }} ref=${{ inputs.ref }} ---"
          cat .shannon/scan.yml

      - name: Deploy this ref to a fresh fly app (built from source)
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="shannon-ezl-${GITHUB_RUN_ID}"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "url=https://$APP.fly.dev" >> "$GITHUB_OUTPUT"
          flyctl apps create "$APP" --org "$FLY_ORG"
          flyctl deploy --remote-only --config fly.toml --app "$APP" --ha=false --yes

      - name: Wait for the deployment to be reachable
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || echo 000)
            echo "attempt $i: HTTP $code"
            case "$code" in 2*|3*|4*) echo "reachable"; exit 0 ;; esac
            sleep 5
          done
          echo "target did not become reachable in time"; exit 1

      - name: Shannon scan (ezl-test/shannon-action@v1)
        uses: ezl-test/shannon-action@v1
        with:
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
          url: ${{ steps.deploy.outputs.url }}
          config: .shannon/scan.yml
          fail-on-severity: ${{ inputs.fail_on }}

      - name: Destroy the per-run fly app
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps destroy "${{ steps.deploy.outputs.app }}" --yes || true
