name: Shannon release scan
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  security-events: write
concurrency:
  group: shannon-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy this tag to fly.io
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --app shannon-vuln-storefront-demo
          echo "url=https://shannon-vuln-storefront-demo.fly.dev" >> "$GITHUB_OUTPUT"
      - name: Wait for the deployment to be reachable
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://shannon-vuln-storefront-demo.fly.dev/ || echo 000)
            echo "attempt $i: HTTP $code"
            case "$code" in 2*|3*|4*) echo "reachable"; exit 0 ;; esac
            sleep 5
          done
          echo "target did not become reachable in time"; exit 1
      - name: Shannon release gate (fail on high)
        uses: aro-local-test/shannon-action@v1
        with:
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
          target-url: ${{ steps.deploy.outputs.url }}
          config-path: .shannon/ci.yml
          fail-on: high
