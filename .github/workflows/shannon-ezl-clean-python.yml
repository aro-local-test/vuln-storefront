name: Shannon (ezl action) - clean Python app (green test)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
concurrency:
  group: shannon-ezl-cleanpy-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FLY_ORG: keygraph-634
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Generate a minimal secure Python app + Dockerfile + config
        run: |
          mkdir -p app
          cat > app/server.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from urllib.parse import urlparse

          PRODUCTS = [
              {"id": 1, "name": "Widget", "price": 10},
              {"id": 2, "name": "Gadget", "price": 20},
          ]


          class Handler(BaseHTTPRequestHandler):
              def _send(self, code, body, ctype="application/json"):
                  payload = body.encode("utf-8")
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(payload)))
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("Content-Security-Policy", "default-src 'none'")
                  self.send_header("X-Frame-Options", "DENY")
                  self.end_headers()
                  self.wfile.write(payload)

              def do_GET(self):
                  path = urlparse(self.path).path
                  if path == "/health":
                      return self._send(200, json.dumps({"ok": True}))
                  if path == "/products":
                      return self._send(200, json.dumps(PRODUCTS))
                  if path.startswith("/products/"):
                      raw = path.split("/")[2] if len(path.split("/")) > 2 else ""
                      if not raw.isdigit():
                          return self._send(400, json.dumps({"error": "bad id"}))
                      item = next((p for p in PRODUCTS if p["id"] == int(raw)), None)
                      if item is None:
                          return self._send(404, json.dumps({"error": "not found"}))
                      return self._send(200, json.dumps(item))
                  self._send(200, "<h1>Clean Store</h1>", "text/html")

              def log_message(self, *args):
                  pass


          if __name__ == "__main__":
              HTTPServer(("0.0.0.0", 3000), Handler).serve_forever()
          PY
          cat > Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          WORKDIR /app
          COPY app/server.py .
          EXPOSE 3000
          CMD ["python", "server.py"]
          DOCKER
          cat > fly.toml <<'TOML'
          app = "placeholder"
          primary_region = "iad"
          [build]
            dockerfile = "Dockerfile"
          [http_service]
            internal_port = 3000
            force_https = true
            auto_stop_machines = "off"
            min_machines_running = 1
          [[vm]]
            size = "shared-cpu-1x"
            memory = "512mb"
          TOML
          mkdir -p .shannon
          printf 'exploit: "true"\nreport:\n  sarif: "true"\nrules_of_engagement: |\n  Ephemeral CI runner, no inbound network or out-of-band collaborator. Do not\n  set up out-of-band callbacks or brute-force credentials; confirm from source\n  or mark blocked and move on. Time-box each candidate.\n' > .shannon/scan.yml

      - name: Deploy the clean Python app to a fresh fly app
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="shannon-ezl-cleanpy-${GITHUB_RUN_ID}"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "url=https://$APP.fly.dev" >> "$GITHUB_OUTPUT"
          flyctl apps create "$APP" --org "$FLY_ORG"
          flyctl deploy --remote-only --config fly.toml --app "$APP" --ha=false --yes

      - name: Wait for the deployment to be reachable
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || echo 000)
            echo "attempt $i: HTTP $code"
            case "$code" in 2*|3*|4*) echo "reachable"; exit 0 ;; esac
            sleep 5
          done
          echo "target did not become reachable in time"; exit 1

      - name: Shannon scan (ezl-test/shannon-action@v1)
        uses: ezl-test/shannon-action@v1
        with:
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
          url: ${{ steps.deploy.outputs.url }}
          config: .shannon/scan.yml
          fail-on-severity: high

      - name: Destroy the per-run fly app
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps destroy "${{ steps.deploy.outputs.app }}" --yes || true
