# App name is a placeholder: each CI run deploys to a fresh app via `flyctl deploy --app <name>`,
# which overrides this value. The build/env/service config below applies to every run.
app = "shannon-vuln-storefront"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  REPORTS_PORT = "5000"
  REPORTS_SVC = "http://127.0.0.1:5000"

[http_service]
  internal_port = 3000
  force_https = true
  # Stay up for the whole scan; the per-run app is destroyed by the workflow afterwards.
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
